<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>iLuminus · Web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B0E}
a{color:#F2F3F5;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;border-radius:14px;cursor:pointer;outline-offset:3px}
input[type=range]::-webkit-slider-runnable-track{height:28px;background:transparent;border-radius:14px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#FFFFFF;border:4px solid #0A0B0E;box-shadow:0 1px 6px rgba(0,0,0,.6)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#FFFFFF;border:4px solid #0A0B0E}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-wrap: wrap; background: #0A0B0E; color: #F2F3F5; font-family: Manrope, system-ui, sans-serif">

  <aside style="flex: 1 1 220px; max-width: 100%; box-sizing: border-box; padding: 24px 16px; background: #0F1014; border-right: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
      <span style="width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: {{tabPill}}">
        <span style="width: 12px; height: 12px; border-radius: 50%; display: block; background: {{pureCss}}"></span>
      </span>
      <span style="font-size: 17px; font-weight: 800; letter-spacing: -0.02em">iLuminus</span>
    </div>
    <nav aria-label="Navegação principal" style="display: flex; flex-direction: column; gap: 4px">
      <a href="#" aria-current="page" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 700; background: {{tabPill}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9V15h7v-1.1A6 6 0 0 0 12 3z"></path></svg>Luz
      </a>
      <a href="#" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; color: #A3A9B4">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg>Efeitos
      </a>
      <a href="#" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; color: #A3A9B4">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"></path></svg>Favoritos
      </a>
      <a href="#" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; color: #A3A9B4">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="13" width="18" height="7" rx="2"></rect><path d="M8.5 9.5a5 5 0 0 1 7 0M5.5 6.5a9.5 9.5 0 0 1 13 0"></path></svg>Dispositivos
      </a>
    </nav>
    <div style="margin-top: auto; padding: 12px; border-radius: 14px; background: #14161B; display: flex; flex-direction: column; gap: 4px">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3DDC84"></span>Sala de estar</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A3A9B4">192.168.15.100</span>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px clamp(16px, 4vw, 48px) 48px">
    <div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">
      <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Sala de estar</h1>
          <p style="margin: 0; font-size: 14px; color: #A3A9B4">{{statusLine}}</p>
        </div>
        <button type="button" onClick="{{togglePower}}" style="height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #14161B; color: #F2F3F5; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.3 6.8a7.5 7.5 0 1 0 11.4 0"></path></svg>{{powerBtn}}
        </button>
      </header>

      <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch">
        <section style="flex: 1 1 380px; min-width: 0; background: #14161B; border-radius: 28px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 28px">
          <button type="button" onClick="{{togglePower}}" aria-label="{{powerLabel}}" style="width: 240px; height: 240px; border-radius: 50%; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: background 160ms, box-shadow 200ms; background: {{orbBg}}; box-shadow: {{orbShadow}}; color: {{orbInk}}">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600">{{orbText}}</span>
            <span style="font-size: 13px; font-weight: 700">{{v}}%</span>
          </button>
          <div style="width: 100%; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 0">
            <sc-for list="{{swatches}}" as="sw" hint-placeholder-count="8">
              <button type="button" onClick="{{sw.pick}}" aria-label="{{sw.label}}" style="height: 48px; background: none; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center">
                <span style="width: 34px; height: 34px; border-radius: 50%; display: block; background: {{sw.css}}; box-shadow: {{sw.ring}}"></span>
              </button>
            </sc-for>
          </div>
          <div style="width: 100%; display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; flex-direction: column; gap: 8px">
              <label for="dhue" style="font-size: 12px; font-weight: 600; color: #A3A9B4">Tom</label>
              <input id="dhue" type="range" min="0" max="359" value="{{h}}" onChange="{{onHue}}" style="background: linear-gradient(90deg,#ff0000,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000)">
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <label for="dsat" style="font-size: 12px; font-weight: 600; color: #A3A9B4">Saturação</label>
              <input id="dsat" type="range" min="0" max="100" value="{{s}}" onChange="{{onSat}}" style="background: {{satTrack}}">
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <label for="dbri" style="font-size: 12px; font-weight: 600; color: #A3A9B4">Brilho</label>
              <input id="dbri" type="range" min="1" max="100" value="{{v}}" onChange="{{onBri}}" style="background: {{briTrack}}">
            </div>
          </div>
        </section>

        <div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
          <section style="background: #14161B; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; justify-content: space-between; align-items: center">
              <h2 style="margin: 0; font-size: 16px; font-weight: 800">Efeitos</h2>
              <a href="#" style="font-size: 13px; font-weight: 700; padding: 10px 0">Ver todos</a>
            </div>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
              <sc-for list="{{effects}}" as="fx" hint-placeholder-count="6">
                <button type="button" onClick="{{fx.pick}}" aria-pressed="{{fx.pressed}}" style="min-height: 76px; border-radius: 16px; background: #0F1014; color: #F2F3F5; cursor: pointer; padding: 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 10px; text-align: left; border: {{fx.border}}">
                  <span style="display: flex; gap: 3px">
                    <sc-for list="{{fx.dots}}" as="d" hint-placeholder-count="9">
                      <span style="width: 8px; height: 8px; border-radius: 50%; display: block; background: {{d}}"></span>
                    </sc-for>
                  </span>
                  <span style="font-size: 13px; font-weight: 700">{{fx.label}}</span>
                </button>
              </sc-for>
            </div>
          </section>

          <section style="background: #14161B; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; justify-content: space-between; align-items: center">
              <h2 style="margin: 0; font-size: 16px; font-weight: 800">Favoritos</h2>
              <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #F2F3F5; font-size: 13px; font-weight: 700; cursor: pointer">Salvar cor atual</button>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 12px">
              <sc-for list="{{favs}}" as="f" hint-placeholder-count="5">
                <button type="button" onClick="{{f.pick}}" style="background: none; border: none; padding: 0; cursor: pointer; color: #C9CDD4; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; width: 64px">
                  <span style="width: 52px; height: 52px; border-radius: 16px; display: block; background: {{f.css}}"></span>{{f.name}}
                </button>
              </sc-for>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  hsv(h, s, v) {
    const f = (n) => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
    return [f(5), f(3), f(1)].map((x) => Math.round(x * 255));
  }
  css(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
  rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  hex(c) { return '#' + c.map((x) => x.toString(16).padStart(2, '0')).join('').toUpperCase(); }
  dots(cmd, c, n) {
    const out = []; const mid = (n - 1) / 2; const fire = [0, 18, 34, 8, 44, 24, 4, 38, 14];
    const dim = (k) => c.map((x) => Math.round(x * k));
    for (let i = 0; i < n; i++) {
      let col; const d = Math.abs(i - mid);
      if (cmd === 'L') col = c;
      else if (cmd === 'R') col = this.hsv(i * 360 / n, 1, 1);
      else if (cmd === 'SP') col = (i === 2 || i === 6) ? [255, 255, 255] : dim(0.4);
      else if (cmd === 'SS') col = this.hsv((330 + i * 9) % 360, 0.85, 1 - i * 0.04);
      else if (cmd === 'OC') col = this.hsv(180 + i * 6, 0.85, i % 2 ? 0.55 : 1);
      else if (cmd === 'FE') col = this.hsv(fire[i % 9], 1, 1 - (i % 3) * 0.15);
      else col = dim(Math.max(0.1, 1 - d * 0.45));
      out.push(this.css(col));
    }
    return out;
  }
  renderVals() {
    const st = Object.assign({ h: 220, s: 95, v: 85, on: true, fx: 'L' }, this.state || {});
    const pure = this.hsv(st.h, st.s / 100, 1);
    const lit = this.hsv(st.h, st.s / 100, Math.max(st.v, 25) / 100);
    const lum = (0.299 * lit[0] + 0.587 * lit[1] + 0.114 * lit[2]) / 255;
    const presets = [[220, 95, 'Azul'], [0, 88, 'Vermelho'], [26, 95, 'Laranja'], [48, 85, 'Amarelo'], [145, 80, 'Verde'], [180, 85, 'Ciano'], [278, 70, 'Roxo'], [34, 22, 'Branco quente']];
    const swatches = presets.map((p) => {
      const sel = Math.abs(st.h - p[0]) < 4 && Math.abs(st.s - p[1]) < 4;
      return { css: this.css(this.hsv(p[0], p[1] / 100, 1)), label: p[2], ring: sel ? '0 0 0 3px #14161B, 0 0 0 5px #F2F3F5' : 'none', pick: () => this.setState({ h: p[0], s: p[1], fx: 'L' }) };
    });
    const defs = [['L', 'Cor sólida'], ['R', 'Arco-íris'], ['SP', 'Faíscas'], ['SS', 'Pôr do sol'], ['OC', 'Oceano'], ['FE', 'Fogo']];
    const names = { L: 'Cor sólida', R: 'Arco-íris', SP: 'Faíscas', SS: 'Pôr do sol', OC: 'Oceano', FE: 'Fogo' };
    const effects = defs.map((d) => ({
      label: d[1], dots: this.dots(d[0], pure, 9), pressed: st.fx === d[0] ? 'true' : 'false',
      border: st.fx === d[0] ? '1.5px solid ' + this.rgba(pure, 0.95) : '1.5px solid rgba(255,255,255,0.06)',
      pick: () => this.setState({ fx: d[0], on: true })
    }));
    const favDefs = [[220, 95, 'Foco'], [26, 95, 'Fim de tarde'], [278, 70, 'Cinema'], [34, 22, 'Leitura'], [180, 85, 'Relaxar']];
    const favs = favDefs.map((f) => ({ css: this.css(this.hsv(f[0], f[1] / 100, 1)), name: f[2], pick: () => this.setState({ h: f[0], s: f[1], fx: 'L' }) }));
    return {
      h: st.h, s: st.s, v: st.v, swatches, effects, favs,
      pureCss: this.css(pure), tabPill: this.rgba(pure, 0.2),
      statusLine: st.on ? 'Ligada · ' + names[st.fx] + ' · ' + this.hex(lit) : 'Desligada',
      powerBtn: st.on ? 'Desligar' : 'Ligar',
      powerLabel: st.on ? 'Desligar a luz' : 'Ligar a luz',
      orbBg: st.on ? this.css(lit) : '#1C1F26',
      orbShadow: st.on ? '0 0 0 14px ' + this.rgba(pure, 0.08) + ', 0 0 0 30px ' + this.rgba(pure, 0.04) + ', 0 0 120px 30px ' + this.rgba(pure, 0.25 + st.v / 250) : 'inset 0 0 0 1px rgba(255,255,255,0.08)',
      orbInk: st.on ? (lum > 0.62 ? '#0A0B0E' : '#FFFFFF') : '#8E95A1',
      orbText: st.on ? this.hex(lit) : 'Desligada',
      satTrack: 'linear-gradient(90deg,#FFFFFF,' + this.css(this.hsv(st.h, 1, 1)) + ')',
      briTrack: 'linear-gradient(90deg,#0A0B0E,' + this.css(pure) + ')',
      togglePower: () => this.setState({ on: !st.on }),
      onHue: (e) => this.setState({ h: +e.target.value, fx: 'L' }),
      onSat: (e) => this.setState({ s: +e.target.value, fx: 'L' }),
      onBri: (e) => this.setState({ v: +e.target.value })
    };
  }
}
</script>
</body>
</html>
