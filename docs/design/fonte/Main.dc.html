<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>iLuminus · Início</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B0E}
a{color:#F2F3F5;text-decoration:none}a:hover{color:#FFFFFF}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;border-radius:14px;cursor:pointer;outline-offset:3px}
input[type=range]::-webkit-slider-runnable-track{height:28px;background:transparent;border-radius:14px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#FFFFFF;border:4px solid #0A0B0E;box-shadow:0 1px 6px rgba(0,0,0,.6)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#FFFFFF;border:4px solid #0A0B0E}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0A0B0E; color: #F2F3F5; font-family: Manrope, system-ui, sans-serif; overflow: hidden; position: relative">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 4px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Sala de estar</h1>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #A3A9B4">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #3DDC84"></span>
        <span>Conectado</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px">192.168.15.100</span>
      </div>
    </div>
    <a href="Devices.dc.html" aria-label="Trocar dispositivo" style="width: 44px; height: 44px; border-radius: 14px; background: #14161B; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F3F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"></path></svg>
    </a>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 14px">

    <section style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 0 6px">
      <button type="button" onClick="{{togglePower}}" aria-label="{{powerLabel}}" style="width: 188px; height: 188px; border-radius: 50%; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: background 160ms, box-shadow 200ms; background: {{orbBg}}; box-shadow: {{orbShadow}}; color: {{orbInk}}">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.3 6.8a7.5 7.5 0 1 0 11.4 0"></path></svg>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600">{{orbText}}</span>
      </button>
      <p style="margin: 0; font-size: 13px; color: #8E95A1">{{powerHint}}</p>
    </section>

    <section style="background: #14161B; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 15px; font-weight: 700">Cor</h2>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A3A9B4">{{pureHex}}</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0">
        <sc-for list="{{swatches}}" as="sw" hint-placeholder-count="7">
          <button type="button" onClick="{{sw.pick}}" aria-label="{{sw.label}}" style="height: 44px; background: none; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center">
            <span style="width: 32px; height: 32px; border-radius: 50%; display: block; background: {{sw.css}}; box-shadow: {{sw.ring}}"></span>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="hue" style="font-size: 12px; font-weight: 600; color: #A3A9B4">Tom</label>
        <input id="hue" type="range" min="0" max="359" value="{{h}}" onChange="{{onHue}}" style="background: linear-gradient(90deg,#ff0000,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000)">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="sat" style="font-size: 12px; font-weight: 600; color: #A3A9B4">Saturação</label>
        <input id="sat" type="range" min="0" max="100" value="{{s}}" onChange="{{onSat}}" style="background: {{satTrack}}">
      </div>
    </section>

    <section style="background: #14161B; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <label for="bri" style="font-size: 15px; font-weight: 700">Brilho</label>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #F2F3F5">{{v}}%</span>
      </div>
      <input id="bri" type="range" min="1" max="100" value="{{v}}" onChange="{{onBri}}" style="background: {{briTrack}}">
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <h2 style="margin: 0; font-size: 15px; font-weight: 700">Efeitos rápidos</h2>
        <a href="Effects.dc.html" style="font-size: 13px; font-weight: 700; padding: 10px 0">Ver todos</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{quick}}" as="fx" hint-placeholder-count="4">
          <button type="button" onClick="{{fx.pick}}" style="min-height: 64px; border-radius: 18px; background: #14161B; color: #F2F3F5; cursor: pointer; padding: 12px 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; border: {{fx.border}}">
            <span style="display: flex; gap: 4px">
              <sc-for list="{{fx.dots}}" as="d" hint-placeholder-count="9">
                <span style="width: 9px; height: 9px; border-radius: 50%; display: block; background: {{d}}"></span>
              </sc-for>
            </span>
            <span style="font-size: 14px; font-weight: 700">{{fx.label}}</span>
          </button>
        </sc-for>
      </div>
    </section>
  </div>

  <nav aria-label="Navegação principal" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 14px; background: #0F1014; border-top: 1px solid rgba(255,255,255,0.07)">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 700; color: #F2F3F5">
      <span style="width: 56px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: {{tabPill}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9V15h7v-1.1A6 6 0 0 0 12 3z"></path></svg>
      </span>Luz
    </a>
    <a href="Effects.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: #8E95A1">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"></path></svg>
      </span>Efeitos
    </a>
    <a href="Favorites.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: #8E95A1">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"></path></svg>
      </span>Favoritos
    </a>
    <a href="Devices.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: #8E95A1">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="13" width="18" height="7" rx="2"></rect><path d="M7 16.5h.01M11 16.5h.01"></path><path d="M8.5 9.5a5 5 0 0 1 7 0M5.5 6.5a9.5 9.5 0 0 1 13 0"></path></svg>
      </span>Dispositivos
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  hsv(h, s, v) {
    const f = (n) => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
    return [f(5), f(3), f(1)].map((x) => Math.round(x * 255));
  }
  css(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
  rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  hex(c) { return '#' + c.map((x) => x.toString(16).padStart(2, '0')).join('').toUpperCase(); }
  dots(cmd, c, n) {
    const out = []; const mid = (n - 1) / 2; const fire = [0, 18, 34, 8, 44, 24, 4, 38, 14];
    for (let i = 0; i < n; i++) {
      let col;
      if (cmd === 'R') col = this.hsv(i * 360 / n, 1, 1);
      else if (cmd === 'OC') col = this.hsv(180 + i * 6, 0.85, i % 2 ? 0.55 : 1);
      else if (cmd === 'FE') col = this.hsv(fire[i % 9], 1, 1 - (i % 3) * 0.15);
      else if (cmd === 'SP') col = (i === 2 || i === 6) ? [255, 255, 255] : c.map((x) => Math.round(x * 0.4));
      else { const d = Math.abs(i - mid); col = c.map((x) => Math.round(x * Math.max(0.12, 1 - d * 0.2))); }
      out.push(this.css(col));
    }
    return out;
  }
  renderVals() {
    const st = Object.assign({ h: 220, s: 95, v: 85, on: true, fx: 'L' }, this.state || {});
    const pure = this.hsv(st.h, st.s / 100, 1);
    const lit = this.hsv(st.h, st.s / 100, Math.max(st.v, 25) / 100);
    const lum = (0.299 * lit[0] + 0.587 * lit[1] + 0.114 * lit[2]) / 255;
    const presets = [[220, 95, 'Azul'], [0, 88, 'Vermelho'], [26, 95, 'Laranja'], [48, 85, 'Amarelo'], [145, 80, 'Verde'], [278, 70, 'Roxo'], [34, 22, 'Branco quente']];
    const swatches = presets.map((p) => {
      const c = this.hsv(p[0], p[1] / 100, 1);
      const sel = Math.abs(st.h - p[0]) < 4 && Math.abs(st.s - p[1]) < 4;
      return { css: this.css(c), label: p[2], ring: sel ? '0 0 0 3px #0A0B0E, 0 0 0 5px #F2F3F5' : 'none', pick: () => this.setState({ h: p[0], s: p[1], fx: 'L' }) };
    });
    const quickDefs = [['L', 'Cor sólida'], ['R', 'Arco-íris'], ['OC', 'Oceano'], ['FE', 'Fogo']];
    const quick = quickDefs.map((q) => ({
      label: q[1], dots: this.dots(q[0], pure, 9),
      border: st.fx === q[0] ? '1.5px solid ' + this.rgba(pure, 0.9) : '1.5px solid rgba(255,255,255,0.06)',
      pick: () => this.setState({ fx: q[0], on: true })
    }));
    return {
      h: st.h, s: st.s, v: st.v,
      pureHex: this.hex(pure),
      orbBg: st.on ? this.css(lit) : '#16181D',
      orbShadow: st.on ? '0 0 0 10px ' + this.rgba(pure, 0.08) + ', 0 0 0 22px ' + this.rgba(pure, 0.05) + ', 0 0 90px 20px ' + this.rgba(pure, 0.25 + st.v / 250) : 'inset 0 0 0 1px rgba(255,255,255,0.08)',
      orbInk: st.on ? (lum > 0.62 ? '#0A0B0E' : '#FFFFFF') : '#8E95A1',
      orbText: st.on ? this.hex(lit) : 'Desligada',
      powerLabel: st.on ? 'Desligar a luz' : 'Ligar a luz',
      powerHint: st.on ? 'Toque na luz para desligar' : 'Toque na luz para ligar',
      satTrack: 'linear-gradient(90deg,#FFFFFF,' + this.css(this.hsv(st.h, 1, 1)) + ')',
      briTrack: 'linear-gradient(90deg,#1C1F26,' + this.css(pure) + ')',
      tabPill: this.rgba(pure, 0.22),
      swatches, quick,
      togglePower: () => this.setState({ on: !st.on }),
      onHue: (e) => this.setState({ h: +e.target.value, fx: 'L' }),
      onSat: (e) => this.setState({ s: +e.target.value, fx: 'L' }),
      onBri: (e) => this.setState({ v: +e.target.value })
    };
  }
}
</script>
</body>
</html>
