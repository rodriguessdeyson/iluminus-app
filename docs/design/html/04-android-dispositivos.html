<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iLuminus · Dispositivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B0E}
a{color:#F2F3F5;text-decoration:none}a:hover{color:#FFFFFF}
button,input{font-family:inherit}
input::placeholder{color:#7D8490}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.6);opacity:0}}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0A0B0E; color: #F2F3F5; font-family: Manrope, system-ui, sans-serif; overflow: hidden">

  <header style="padding: 20px 20px 8px; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Dispositivos</h1>
    <p style="margin: 0; font-size: 13px; color: #A3A9B4">Fitas iLuminus na sua rede Wi-Fi</p>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 16px">

    <section style="background: #14161B; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 48px; height: 48px; border-radius: 14px; background: rgba(13,89,242,0.18); display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <span style="width: 18px; height: 18px; border-radius: 50%; display: block; background: #0D59F2; box-shadow: 0 0 16px 4px rgba(13,89,242,0.6)"></span>
        </span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 16px; font-weight: 800">Sala de estar</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A3A9B4">192.168.15.100 · 9 LEDs</span>
        </div>
        <span style="height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(61,220,132,0.14); color: #6EE7A8; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: #3DDC84"></span>Conectado
        </span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #1C1F26; color: #F2F3F5; font-size: 14px; font-weight: 700; cursor: pointer">Renomear</button>
        <button type="button" style="height: 44px; border-radius: 12px; border: 1px solid rgba(245,158,139,0.3); background: transparent; color: #F59E8B; font-size: 14px; font-weight: 700; cursor: pointer">Esquecer</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <h2 style="margin: 0; font-size: 15px; font-weight: 700">Na rede</h2>
        <span style="font-size: 12px; color: #A3A9B4">2 encontrados</span>
      </div>

      <button type="button" style="height: 56px; border-radius: 16px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 15px; font-weight: 800; background: #0D59F2; color: #FFFFFF">
        <span style="position: relative; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center">
          
          <span style="width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: block"></span>
        </span>Procurar na rede</button>

      
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #14161B">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: #1C1F26; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9CDD4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="13" width="18" height="7" rx="2"></rect><path d="M7 16.5h.01M11 16.5h.01"></path><path d="M8.5 9.5a5 5 0 0 1 7 0"></path></svg>
          </span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 700">Quarto</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A3A9B4">192.168.15.112</span>
          </span>
          <button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: none; background: #F2F3F5; color: #0A0B0E; font-size: 13px; font-weight: 800; cursor: pointer">Conectar</button>
        </div>
      
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #14161B">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: #1C1F26; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9CDD4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="13" width="18" height="7" rx="2"></rect><path d="M7 16.5h.01M11 16.5h.01"></path><path d="M8.5 9.5a5 5 0 0 1 7 0"></path></svg>
          </span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 700">Escritório</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A3A9B4">192.168.15.131</span>
          </span>
          <button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: none; background: #F2F3F5; color: #0A0B0E; font-size: 13px; font-weight: 800; cursor: pointer">Conectar</button>
        </div>
      
    </section>

    <section style="background: #14161B; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <label for="ip" style="font-size: 15px; font-weight: 700">Adicionar pelo IP</label>
      <div style="display: flex; gap: 8px">
        <input id="ip" type="text" inputmode="decimal" placeholder="192.168.0.50" style="flex: 1 1 0%; min-width: 0px; height: 48px; padding: 0px 14px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.12); background: rgb(10, 11, 14); color: rgb(242, 243, 245); font-family: &quot;JetBrains Mono&quot;, monospace; font-size: 14px;">
        <button type="button" style="height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #1C1F26; color: #F2F3F5; font-size: 14px; font-weight: 700; cursor: pointer">Testar</button>
      </div>
      <p style="margin: 0; font-size: 12px; line-height: 1.5; color: #A3A9B4">O IP aparece no monitor serial do ESP8266 ou na lista de clientes do roteador.</p>
    </section>
  </div>

  <nav aria-label="Navegação principal" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 14px; background: #0F1014; border-top: 1px solid rgba(255,255,255,0.07)">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: #8E95A1">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9V15h7v-1.1A6 6 0 0 0 12 3z"></path></svg>
      </span>Luz
    </a>
    <a href="Effects.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: #8E95A1">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"></path></svg>
      </span>Efeitos
    </a>
    <a href="Favorites.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: #8E95A1">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"></path></svg>
      </span>Favoritos
    </a>
    <a href="Devices.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 700; color: #F2F3F5">
      <span style="width: 56px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: rgba(13,89,242,0.22)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="13" width="18" height="7" rx="2"></rect><path d="M7 16.5h.01M11 16.5h.01"></path><path d="M8.5 9.5a5 5 0 0 1 7 0M5.5 6.5a9.5 9.5 0 0 1 13 0"></path></svg>
      </span>Dispositivos
    </a>
  </nav>
</div>
</body>
</html>
