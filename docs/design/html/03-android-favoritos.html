<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iLuminus · Favoritos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B0E}
a{color:#F2F3F5;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0A0B0E; color: #F2F3F5; font-family: Manrope, system-ui, sans-serif; overflow: hidden">

  <header style="padding: 20px 20px 8px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Favoritos</h1>
    <div role="tablist" aria-label="Ver" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #14161B">
      <button type="button" role="tab" aria-selected="true" style="height: 40px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: 700; background: #F2F3F5; color: #0A0B0E">Salvas</button>
      <button type="button" role="tab" aria-selected="false" style="height: 40px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: 700; background: transparent; color: #C9CDD4">Recentes</button>
    </div>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 12px">
    
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        
          <button type="button" style="border-radius: 20px; background: #14161B; color: #F2F3F5; cursor: pointer; padding: 10px; display: flex; flex-direction: column; gap: 10px; text-align: left; border: 1.5px solid #F2F3F5">
            <span style="height: 84px; width: 100%; border-radius: 14px; display: flex; align-items: flex-end; justify-content: flex-start; padding: 10px; box-sizing: border-box; background: rgb(11,79,217)">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; padding: 3px 6px; border-radius: 6px; background: rgba(10,11,14,0.72); color: #F2F3F5">#0B4FD9</span>
            </span>
            <span style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px 4px">
              <span style="font-size: 14px; font-weight: 700">Foco</span>
              <span style="font-size: 12px; color: #A3A9B4">Cor sólida · 85%</span>
            </span>
          </button>
        
          <button type="button" style="border-radius: 20px; background: #14161B; color: #F2F3F5; cursor: pointer; padding: 10px; display: flex; flex-direction: column; gap: 10px; text-align: left; border: 1.5px solid transparent">
            <span style="height: 84px; width: 100%; border-radius: 14px; display: flex; align-items: flex-end; justify-content: flex-start; padding: 10px; box-sizing: border-box; background: rgb(179,82,9)">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; padding: 3px 6px; border-radius: 6px; background: rgba(10,11,14,0.72); color: #F2F3F5">#B35209</span>
            </span>
            <span style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px 4px">
              <span style="font-size: 14px; font-weight: 700">Fim de tarde</span>
              <span style="font-size: 12px; color: #A3A9B4">Cor sólida · 70%</span>
            </span>
          </button>
        
          <button type="button" style="border-radius: 20px; background: #14161B; color: #F2F3F5; cursor: pointer; padding: 10px; display: flex; flex-direction: column; gap: 10px; text-align: left; border: 1.5px solid transparent">
            <span style="height: 84px; width: 100%; border-radius: 14px; display: flex; align-items: flex-end; justify-content: flex-start; padding: 10px; box-sizing: border-box; background: rgb(114,46,153)">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; padding: 3px 6px; border-radius: 6px; background: rgba(10,11,14,0.72); color: #F2F3F5">#722E99</span>
            </span>
            <span style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px 4px">
              <span style="font-size: 14px; font-weight: 700">Cinema</span>
              <span style="font-size: 12px; color: #A3A9B4">Pulsar · 60%</span>
            </span>
          </button>
        
          <button type="button" style="border-radius: 20px; background: #14161B; color: #F2F3F5; cursor: pointer; padding: 10px; display: flex; flex-direction: column; gap: 10px; text-align: left; border: 1.5px solid transparent">
            <span style="height: 84px; width: 100%; border-radius: 14px; display: flex; align-items: flex-end; justify-content: flex-start; padding: 10px; box-sizing: border-box; background: rgb(255,231,199)">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; padding: 3px 6px; border-radius: 6px; background: rgba(10,11,14,0.72); color: #F2F3F5">#FFE7C7</span>
            </span>
            <span style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px 4px">
              <span style="font-size: 14px; font-weight: 700">Leitura</span>
              <span style="font-size: 12px; color: #A3A9B4">Cor sólida · 100%</span>
            </span>
          </button>
        
          <button type="button" style="border-radius: 20px; background: #14161B; color: #F2F3F5; cursor: pointer; padding: 10px; display: flex; flex-direction: column; gap: 10px; text-align: left; border: 1.5px solid transparent">
            <span style="height: 84px; width: 100%; border-radius: 14px; display: flex; align-items: flex-end; justify-content: flex-start; padding: 10px; box-sizing: border-box; background: rgb(29,191,191)">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; padding: 3px 6px; border-radius: 6px; background: rgba(10,11,14,0.72); color: #F2F3F5">#1DBFBF</span>
            </span>
            <span style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px 4px">
              <span style="font-size: 14px; font-weight: 700">Relaxar</span>
              <span style="font-size: 12px; color: #A3A9B4">Oceano · 75%</span>
            </span>
          </button>
        
        <a href="Main.dc.html" style="border-radius: 20px; border: 1.5px dashed rgba(255,255,255,0.16); min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700; color: #C9CDD4">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          Salvar cor atual
        </a>
      </div>
    
    
  </div>

  <nav aria-label="Navegação principal" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 14px; background: #0F1014; border-top: 1px solid rgba(255,255,255,0.07)">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: #8E95A1">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9V15h7v-1.1A6 6 0 0 0 12 3z"></path></svg>
      </span>Luz

    <a href="Effects.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: #8E95A1">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"></path></svg>
      </span>Efeitos
    </a>
    <a href="Favorites.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 700; color: #F2F3F5">
      <span style="width: 56px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: rgba(13,89,242,0.22)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"></path></svg>
      </span>Favoritos
    </a>
    <a href="Devices.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: #8E95A1">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="13" width="18" height="7" rx="2"></rect><path d="M7 16.5h.01M11 16.5h.01"></path><path d="M8.5 9.5a5 5 0 0 1 7 0M5.5 6.5a9.5 9.5 0 0 1 13 0"></path></svg>
      </span>Dispositivos
    </a>
  </nav>
</div>
</body>
</html>
